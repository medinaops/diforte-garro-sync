name: instalador
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del instalador en Windows PowerShell 5.1
        shell: powershell
        run: .\ci\probar_instalador.ps1
      - name: Tests de Python
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest psycopg2-binary
          python -m pytest -q test_garro_sync.py
